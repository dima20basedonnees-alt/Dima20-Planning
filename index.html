<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dima20 Planning</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f26a0f"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fbf7f3;--cd:#fff;--tx:#241b14;--mu:#7a6c60;--bd:#eadfd5;--ac:#f26a0f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--cd:#221b15;--tx:#f3ece6;--mu:#a99a8d;--bd:#372d24;--ac:#ff8a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120e;--cd:#221b15;--tx:#f3ece6;--mu:#a99a8d;--bd:#372d24;--ac:#ff8a3d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 90px;max-width:1100px;margin:auto}
button,select,input{font:inherit;color:var(--tx)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{height:46px;max-width:55%;object-fit:contain;background:#fff;border-radius:10px;padding:3px 8px}
.hb{display:flex;gap:6px}
.ic{padding:9px 12px;border:1px solid var(--bd);background:var(--cd);border-radius:10px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:4px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:3px}
.tab{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;cursor:pointer;color:var(--mu);font-size:14px}
.tab.on{background:var(--ac);color:#fff;font-weight:600}
.sum{color:var(--mu);font-size:13px;margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid.h{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.grid.h .col{flex:0 0 220px;scroll-snap-align:start}
.grid.v{grid-template-columns:1fr}
.col{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;min-height:80px}
.col h3{margin:0 0 6px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.col.today{border-color:var(--ac)}
.ev{border-left:4px solid;border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.ev b{display:block;font-size:14px}.ev small{color:var(--mu);display:block}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--ac);color:#fff;margin-top:2px}
.warn{color:#e03131;font-size:12px;font-weight:600}.empty{color:var(--mu);font-size:13px;padding:6px 2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:32px;line-height:1;box-shadow:0 4px 14px #0004;cursor:pointer;z-index:5}
.ph{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:10px}.ph summary{cursor:pointer;font-weight:600}
.dp,.lk{margin-top:8px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer}.dp{color:#e03131}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);width:min(94vw,420px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px}.row>div{flex:1}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.acts .ok{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.acts .del{color:#e03131}
#dlg3 .ic{width:100%}#dlg3 .row{margin-top:8px}#sh-m{font-size:13px;color:var(--mu);min-height:18px}
#alm{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;background:#e03131;color:#fff;border-radius:12px;padding:12px;display:none;gap:10px;align-items:center;font-weight:600}#alm.on{display:flex}#alm button{margin-left:auto;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
</style></head><body>

<script>
const SUBJ=["Arabe","Français","Anglais","Espagnol","Allemand","Italien","Tamazight","Mathématiques","Physique-Chimie","SVT","Informatique","Sciences de l’ingénieur","Philosophie","Histoire-Géographie","Éducation islamique","Éducation physique","Éducation artistique","Économie générale et statistiques","Comptabilité","Organisation de l’entreprise","Droit","Autre"];
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const LAYS=["h","v",""],LI={h:"↔",v:"↕","":"▦"};
const SHARE_URL=/^https?:/.test(location.href)?location.href.split("#")[0].replace(/index\.html$/,""):"";
const $=id=>document.getElementById(id);
let ev=[],view="week",cur=null,lay="h",PH="",SHT="",phOpen=false;
try{ev=JSON.parse(localStorage.getItem("edt")||"[]");const l=localStorage.getItem("edtl");if(l!==null)lay=l;PH=localStorage.getItem("edtp")||""}catch(e){}
const save=()=>{try{localStorage.setItem("edt",JSON.stringify(ev))}catch(e){}};
const hue=s=>Math.max(0,SUBJ.indexOf(s))*47%360;
const mins=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const dur=e=>Math.max(0,mins(e.b)-mins(e.a))/60;
$("f-s").innerHTML=SUBJ.map(s=>`<option>${s}</option>`).join("");
$("f-d").innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
const clash=e=>ev.some(o=>o.id!==e.id&&o.d===e.d&&mins(o.a)<mins(e.b)&&mins(e.a)<mins(o.b));
function card(e){const h=hue(e.s);
return `<div class="ev" data-id="${e.id}" style="border-color:hsl(${h} 65% 50%);background:hsl(${h} 70% 50% / .14)"><b>${e.s}</b>${e.a} – ${e.b}${e.r?` · ${e.r}`:""}${e.t?`<small>${e.t}</small>`:""}${e.n?`<small>${e.n}</small>`:""}${+e.m?`<small>🔔 ${e.m} min avant</small>`:""}${e.k==="extra"?`<span class="tag">Soutien</span>`:""}${clash(e)?`<div class="warn">⚠ Chevauchement</div>`:""}</div>`}
const dayEvs=(d,f)=>ev.filter(e=>e.d===d&&(!f||e.k===f)).sort((x,y)=>mins(x.a)-mins(y.a));
function render(){
 const sum=k=>ev.filter(e=>e.k===k).reduce((t,e)=>t+dur(e),0).toFixed(1).replace(".0","");
 $("sum").textContent=`${sum("reg")} h de cours · ${sum("extra")} h de soutien par semaine`;
 $("lay").textContent=LI[lay];
 const td=(new Date().getDay()+6)%7;let h="";
 if(view==="today"){const l=dayEvs(td);h=`<div class="col today"><h3>${DAYS[td]} · aujourd’hui</h3>${l.map(card).join("")||'<div class="empty">Rien de prévu aujourd’hui 🎉</div>'}</div>`}
 else{const f=view==="extra"?"extra":null;h='<div class="grid '+lay+'">'+DAYS.map((n,i)=>{const l=dayEvs(i,f);return `<div class="col${i===td?" today":""}"><h3>${n}</h3>${l.map(card).join("")||'<div class="empty">—</div>'}</div>`}).join("")+"</div>"}
 $("view").innerHTML=h;
 $("ph").innerHTML=PH?`<details class="ph"${phOpen?" open":""}><summary>🖼 Ma photo de référence</summary><img src="${PH}" style="width:100%;border-radius:8px;margin-top:8px"><button class="dp" id="dph">Supprimer la photo</button></details>`:"";phOpen=false;
 if($("dph"))$("dph").onclick=()=>{PH="";try{localStorage.removeItem("edtp")}catch(e){}render()};
 document.querySelectorAll(".ev").forEach(x=>x.onclick=()=>openEv(ev.find(e=>e.id===x.dataset.id)));
}
function openEv(e){cur=e||null;const v=e||{s:SUBJ[0],k:view==="extra"?"extra":"reg",d:(new Date().getDay()+6)%7,a:"08:00",b:"09:00",r:"",t:"",n:"",m:"10"};
 $("f-s").value=v.s;$("f-k").value=v.k;$("f-d").value=v.d;$("f-a").value=v.a;$("f-b").value=v.b;$("f-r").value=v.r;$("f-t").value=v.t;$("f-n").value=v.n;$("f-m").value=v.m||"0";$("f-e").textContent="";
 $("f-del").style.display=e?"":"none";$("dlg").showModal()}
$("add").onclick=()=>openEv(null);
$("f-no").onclick=()=>$("dlg").close();
$("f-del").onclick=()=>{ev=ev.filter(e=>e!==cur);save();render();$("dlg").close()};
$("f-ok").onclick=()=>{
 if(mins($("f-b").value)<=mins($("f-a").value)){$("f-e").textContent="L’heure de fin doit être après le début.";return}
 const o={id:cur?cur.id:String(Date.now()),s:$("f-s").value,k:$("f-k").value,d:+$("f-d").value,a:$("f-a").value,b:$("f-b").value,r:$("f-r").value.trim(),t:$("f-t").value.trim(),n:$("f-n").value.trim(),m:$("f-m").value};
 if(cur)ev[ev.indexOf(cur)]=o;else ev.push(o);if(+o.m)prime();
 save();render();$("dlg").close()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
$("lay").onclick=()=>{lay=LAYS[(LAYS.indexOf(lay)+1)%3];try{localStorage.setItem("edtl",lay)}catch(e){}render()};
/* alarme */
let ac=null,beepT=null,fired={};
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function beep(){if(!ac)return;[0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.15)})}
function ring(msg){$("alm-t").textContent=msg;$("alm").classList.add("on");beep();clearInterval(beepT);beepT=setInterval(beep,1500);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{if("Notification"in window&&Notification.permission==="granted")new Notification("Rappel",{body:msg})}catch(e){}}
$("alm-x").onclick=()=>{clearInterval(beepT);$("alm").classList.remove("on")};
function prime(){ctx();try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
$("f-tst").onclick=()=>{prime();ring("🔔 Test : l’alarme fonctionne !")};
function check(){const n=new Date(),d=(n.getDay()+6)%7,nm=n.getHours()*60+n.getMinutes(),key=n.toDateString();
 ev.forEach(e=>{const m=+e.m;if(!m||e.d!==d)return;const s=mins(e.a),k=e.id+key+e.a;
  if(nm>=s-m&&nm<s&&!fired[k]){fired[k]=1;ring(`🔔 ${e.s} commence à ${e.a}${e.r?" · salle "+e.r:""}`)}})}
setInterval(check,15000);check();
document.addEventListener("click",ctx,{once:true});
/* photo de référence */
function shrink(f){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(),"image/jpeg",.8)};im.onerror=ko;im.src=u})}
$("cam").onclick=()=>$("pic").click();
$("pic").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const b=await shrink(f);PH=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});localStorage.setItem("edtp",PH);phOpen=true;render()}catch(x){render()}};
/* partage */
function txt(){if(!ev.length)return"";return "📅 Mon emploi du temps"+DAYS.map((d,i)=>{const l=dayEvs(i);return l.length?"\n\n"+d+" :\n"+l.map(e=>`• ${e.a}–${e.b} ${e.s}${e.r?" ("+e.r+")":""}${e.k==="extra"?" [soutien]":""}`).join("\n"):""}).join("")}
function setSh(w){SHT=w==="a"?"📚 Dima20 Planning : organise tes cours et tes séances de soutien, avec rappels."+(SHARE_URL?"\n"+SHARE_URL:""):(txt()||"Aucune séance à partager pour le moment.");$("sh-t").textContent=SHT;$("sh-m").textContent=""}
async function cp(){try{await navigator.clipboard.writeText(SHT);return 1}catch(e){const t=document.createElement("textarea");t.value=SHT;document.body.appendChild(t);t.select();let ok=0;try{ok=document.execCommand("copy")}catch(e2){}t.remove();return ok}}
$("shr").onclick=()=>{setSh("a");$("dlg3").showModal()};
$("sh-app").onclick=()=>setSh("a");$("sh-edt").onclick=()=>setSh("e");
$("sh-wa").onclick=()=>{window.open("https://wa.me/?text="+encodeURIComponent(SHT),"_blank")};
$("sh-fb").onclick=()=>{window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(SHARE_URL||"https://www.facebook.com")+"&quote="+encodeURIComponent(SHT),"_blank")};
$("sh-mo").onclick=async()=>{try{await navigator.share({text:SHT})}catch(e){if(!e||e.name!=="AbortError")$("sh-m").textContent=(await cp())?"Texte copié ✔ : collez-le dans Instagram, Messenger…":"Copie impossible."}};
$("sh-cp").onclick=async()=>{$("sh-m").textContent=(await cp())?"Copié ✔ : collez-le dans Instagram, Messenger…":"Copie impossible."};
$("sh-x").onclick=()=>$("dlg3").close();
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
